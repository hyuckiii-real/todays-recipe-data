name: Daily Recipe Generator

on:
  schedule:
    # 매일 UTC 15:00 = 한국 시간(KST) 자정 00:00
    - cron: '12 15 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼 활성화

permissions:
  contents: write

jobs:
  generate-recipe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai pydantic

      - name: Run recipe generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_recipe.py

      - name: Commit and push generated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add today.json archive.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update today's recipe ($(date -u +'%Y-%m-%d'))" && git push)
